services:
  - type: web
    name: rock-river-gauges-live
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run rock_river_dashboard_v5_6.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: APP_PASSWORD
        sync: false
